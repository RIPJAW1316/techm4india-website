services:
  postgres:
    image: postgres:16-alpine
    container_name: techm4india-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: techm4india_erp
      POSTGRES_USER: techm4india
      POSTGRES_PASSWORD: techm4india_dev_only
    ports:
      - "5433:5432"
    volumes:
      - techm4india-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techm4india -d techm4india_erp"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  techm4india-postgres-data:
