# Render Blueprint specification for TechM4India ERP Backend (Backend Subdirectory)
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: techm4india-erp-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: techm4india-erp-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 30d
      - key: REFRESH_COOKIE_NAME
        value: tm4_refresh
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: TRUST_PROXY
        value: "true"
      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
      - key: CORS_ORIGINS
        value: https://techm4india.com,https://www.techm4india.com,http://localhost:3000

databases:
  - name: techm4india-erp-db
    databaseName: techm4india_erp
    user: techm4india
    plan: starter
    region: singapore
    postgresMajorVersion: 16
