# Render Blueprint for the TechM4India ERP API.
# The production database is the existing Neon database; configure its URL
# as a secret in Render to preserve ERP accounts and records.
services:
  - type: web
    name: techm4india-erp-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 30d
      - key: REFRESH_COOKIE_NAME
        value: tm4_refresh
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: TRUST_PROXY
        value: "true"
      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
      - key: CORS_ORIGINS
        value: https://techm4india.com,https://www.techm4india.com,https://techm4india-website.vercel.app