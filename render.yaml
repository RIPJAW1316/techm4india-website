services:
  # 1. Central NestJS Backend API Service
  - type: web
    name: techm4india-api
    env: node
    plan: starter
    rootDir: apps/api
    buildCommand: npm install && npm run prisma:generate && npm run build
    preDeployCommand: npm run prisma:migrate
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: API_PREFIX
        value: api/v1
      - key: SWAGGER_PATH
        value: api/v1/docs
      - key: CORS_ORIGIN
        value: https://techm4india.com,https://hrms.techm4india.com,https://finance.techm4india.com
      - key: DATABASE_URL
        fromDatabase:
          name: techm4india-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # 2. Standalone HRMS Frontend Static Site
  - type: static
    name: techm4india-hrms
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build:hrms
    staticPublishPath: apps/hrms/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE_URL
        value: https://techm4india-erp-api-l1gv.onrender.com/api/v1
      - key: VITE_CENTRAL_AUTH_URL
        value: https://techm4india.com/login
      - key: VITE_OIDC_CLIENT_ID
        value: hrms-app-client
      - key: VITE_APP_ORIGIN
        value: https://hrms.techm4india.com

databases:
  - name: techm4india-erp-db
    plan: starter
    databaseName: techm4india_erp
    user: techm4india_admin
    ipAllowList:
      - source: 0.0.0.0/0
        description: External access for developer backends (SSL required)
