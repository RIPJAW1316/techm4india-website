# Render Blueprint specification for TechM4India ERP Backend
# Documentation: https://render.com/docs/blueprint-spec

services:
  # TechM4India ERP NestJS API Web Service
  - type: web
    name: techm4india-erp-api
    runtime: node
    plan: free # Change to 'free' if evaluating on Render free tier
    region: singapore # Closest region to India (Asia/Kolkata)
    rootDir: backend
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: techm4india-erp-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render automatically generates a cryptographically secure 32+ character string
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 30d
      - key: REFRESH_COOKIE_NAME
        value: tm4_refresh
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none # Set to 'none' for cross-domain HTTPS cookies (e.g. frontend on Vercel, backend on onrender.com)
      - key: TRUST_PROXY
        value: "true" # Required because Render routes traffic through an SSL reverse proxy
      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
      - key: CORS_ORIGINS
        value: https://techm4india.com,https://www.techm4india.com,https://techm4india-website.vercel.app,http://localhost:3000

databases:
  # Managed PostgreSQL 16 Database
  - name: techm4india-erp-db
    databaseName: techm4india_erp
    user: techm4india
    plan: free # Change to 'free' if evaluating (note: Render free DBs expire after 30 days)
    region: singapore
    postgresMajorVersion: 16
